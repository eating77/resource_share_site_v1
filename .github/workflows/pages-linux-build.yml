name: Build Cloudflare Pages on Linux

on:
  push:
    branches:
      - feat/cloudflare-workers
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Cloudflare Pages output
        run: npm run pages:build

      - name: Verify function registration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          // All dynamic-segment routes ([resourceId], [categoryId], ...) have been replaced
          // with ?id= query parameters, so the next-on-pages function-mapping bug cannot
          // occur for dynamic segments. Instead we verify:
          //   1) the query-param functions we depend on actually exist, and
          //   2) no two .func directories resolve to the SAME .vc-config.json
          //      (the next-on-pages symlink-collapse bug that previously mapped every
          //       /api/* function onto api/admin/reset-demo).
          const functionsDir = ".vercel/output/functions";
          if (!fs.existsSync(functionsDir)) {
            throw new Error(`Functions directory not found: ${functionsDir}`);
          }

          const funcDirs = fs
            .readdirSync(functionsDir, { withFileTypes: true })
            .filter((e) => e.isDirectory() && e.name.endsWith(".func"))
            .map((e) => e.name);

          const required = [
            "api/resources.func",
            "api/resources/claim.func",
            "api/resources/claim-status.func",
            "api/resources/task.func",
            "api/resources/view.func",
            "api/categories.func",
            "api/submissions.func",
            "api/upload.func",
            "api/announcements.func",
            "api/site-settings.func",
            "api/admin/reset-demo.func",
            "resource.func",
            "resource/task.func",
            "resource/success.func",
            "category.func",
          ];
          const missing = required.filter((f) => !funcDirs.includes(f));
          if (missing.length > 0) {
            throw new Error(`Required functions missing from build output: ${missing.join(", ")}`);
          }

          const seen = new Map(); // realpath -> funcName
          const problems = [];
          for (const funcName of funcDirs) {
            const configPath = path.join(functionsDir, funcName, ".vc-config.json");
            if (!fs.existsSync(configPath)) {
              problems.push(`${funcName} has no .vc-config.json`);
              continue;
            }
            const real = fs.realpathSync(configPath);
            if (seen.has(real)) {
              problems.push(`${funcName} resolves to the SAME config as ${seen.get(real)} (function-mapping bug)`);
            } else {
              seen.set(real, funcName);
            }
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            const expectedName = funcName.replace(/\.func$/, "");
            if (config.name !== expectedName) {
              problems.push(`${funcName} declares name "${config.name}"; expected "${expectedName}"`);
            }
          }

          if (problems.length > 0) {
            throw new Error(`Function verification failed:\n  - ${problems.join("\n  - ")}`);
          }

          console.log(`Verified ${funcDirs.length} function manifests. No dynamic segments, no mis-mapped functions.`);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: .vercel/output/static
          if-no-files-found: warn
          retention-days: 7
